<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="极省"><meta name="theme-color" content="#075e50"><title>SmartSave 极省</title><style>
*{box-sizing:border-box}body{margin:auto;max-width:640px;background:#f3f6f5;color:#18352e;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:22px 16px 50px}header{padding:12px 0}h1{font-size:32px;margin:0}h2{font-size:19px}small,p{line-height:1.6;color:#52675f}section{background:white;border-radius:18px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d3dfd9;width:100%;margin:5px 0}button{background:#075e50;color:white;border:0;font-weight:600}button.secondary{background:#e5eeea;color:#075e50}a{color:#075e50;display:block;padding:10px 0;overflow-wrap:anywhere}label{display:block;margin-top:8px;font-size:14px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.price{font-size:34px;font-weight:700;color:#075e50}.item{border-top:1px solid #d3dfd9;padding:10px 0}.note{font-size:13px}nav{display:flex;gap:6px;position:sticky;bottom:0;background:#f3f6f5;padding:6px 0}nav button{font-size:14px}.hidden{display:none}</style>
<header><small>SMARTSAVE · PERSONAL SHOPPING</small><h1>极省</h1><p>先找优惠，再决定怎么买。</p></header>
<section id="search"><h2>全网优惠搜索</h2><textarea id="link" rows="3" placeholder="粘贴商品分享链接或完整分享文字"></textarea><button id="go">全网找优惠</button><p id="status" class="note">当前版本：公开搜索入口聚合，尚未连接实时搜索服务。</p><div id="results"></div><label>商品名称 / 型号（识别不到时补充）</label><input id="name" placeholder="可选"><button class="secondary" id="saveProduct">收藏商品</button></section>
<section id="calc"><h2>最低实付计算</h2><label>商品总价（元）</label><input id="price" type="number" min="0" step=".01" inputmode="decimal"><label>运费（元）</label><input id="shipping" type="number" min="0" step=".01" value="0"><label>预计返利（元，不计入实付）</label><input id="rebate" type="number" min="0" step=".01" value="0"><p class="note">仅计算你勾选且确认适用、允许按指定顺序叠加的券。同组券互斥。门槛按当前金额计算；实际规则以平台为准。</p><div id="eligible"></div><button id="calculate">计算最优组合</button><div id="answer"></div></section>
<section id="wallet"><h2>囤券中心</h2><input id="couponName" placeholder="优惠券名称"><input id="source" placeholder="来源，例如直播间 / 店铺 / 网站"><input id="couponUrl" placeholder="领券链接（可选）"><div class="row"><select id="kind"><option value="fixed">满减 / 立减</option><option value="percent">折扣（减免百分比）</option></select><input id="value" type="number" min="0" step=".01" placeholder="金额 / 百分比"></div><div class="row"><input id="threshold" type="number" min="0" step=".01" placeholder="满减门槛（元）"><input id="group" placeholder="互斥组（如店铺券）"></div><label>计算顺序（数字小的先用）</label><input id="stage" type="number" min="0" value="1"><label>有效期（可选）</label><input id="expiry" type="date"><button id="add">保存优惠券</button><div id="coupons"></div></section>
<section id="products"><h2>收藏商品</h2><div id="saved"></div></section>
<script>
const $=id=>document.getElementById(id);let db;try{db=JSON.parse(localStorage.getItem('smartsave-v1'))||{coupons:[],products:[]}}catch{db={coupons:[],products:[]}};const persist=()=>localStorage.setItem('smartsave-v1',JSON.stringify(db));const money=n=> '¥'+(n/100).toFixed(2);const cents=x=>Math.round(Number(x)*100);const safe=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};const node=(tag,t,parent)=>{let e=document.createElement(tag);e.textContent=t;parent.append(e);return e};const anchor=(parent,title,url)=>{let a=node('a',title,parent);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a};const valid=c=>!c.expiry||c.expiry>=new Date().toLocaleDateString('sv-SE');const extract=()=>{let s=$('link').value.trim();let m=s.match(/https?:\/\/[^\s<>，。！？]+/);return m?safe(m[0]):null};
$('go').onclick=()=>{let u=extract(),name=$('name').value.trim(),raw=$('link').value.trim();if(!raw&&!name){$('status').textContent='请粘贴商品链接。';return}let id='';if(u){let x=new URL(u);id=x.searchParams.get('id')||x.searchParams.get('goods_id')||x.searchParams.get('skuId')||''}let q=name||raw.replace(/https?:\/\/[^\s]+/g,'').trim()||id||u||raw;let r=$('results');r.replaceChildren();$('status').textContent='已生成公开搜索入口。需打开结果核验；当前没有自动抓取或确认任何优惠券。';if(u)anchor(r,'打开原商品',u);for(let [label,extra] of [['全网隐藏券','优惠券 隐藏券 满减'],['直播间 / 主播券','主播 直播间 专属券'],['第三方返利','返利 优惠码'],['小红书','site:xiaohongshu.com 优惠'],['抖音','site:douyin.com 优惠券'],['快手','site:kuaishou.com 优惠券'],['什么值得买','site:smzdm.com 好价'],['微信公开文章','site:mp.weixin.qq.com 优惠券'],['京东同款','京东 价格'],['淘宝同款','淘宝 价格'],['拼多多同款','拼多多 价格'],['支付优惠','支付立减 银行优惠']])anchor(r,label,'https://www.baidu.com/s?wd='+encodeURIComponent(q+' '+extra));};
function render(){let c=$('coupons'),e=$('eligible'),p=$('saved');c.replaceChildren();e.replaceChildren();p.replaceChildren();db.coupons.forEach((x,i)=>{let d=node('div','',c);d.className='item';node('strong',x.name+' · '+(x.kind==='fixed'?money(x.value):x.value+'%'),d);node('p',x.source+' | '+(valid(x)?'有效期内':'已过期')+' | '+(x.expiry||'未记录有效期'),d);if(x.url)anchor(d,'领券来源',x.url);let b=node('button','删除',d);b.className='secondary';b.onclick=()=>{db.coupons.splice(i,1);persist();render()};if(valid(x)){let l=node('label','',e);let chk=document.createElement('input');chk.type='checkbox';chk.style.width='auto';chk.value=i;l.append(chk,document.createTextNode(' '+x.name+'（确认适用）'))}});db.products.forEach((x,i)=>{let d=node('div','',p);d.className='item';anchor(d,x.name||x.url,x.url);node('small',x.date,d);let b=node('button','删除',d);b.className='secondary';b.onclick=()=>{db.products.splice(i,1);persist();render()}})}
$('add').onclick=()=>{let name=$('couponName').value.trim(),kind=$('kind').value,v=Number($('value').value),t=Number($('threshold').value||0),stage=Number($('stage').value);if(!name||!Number.isFinite(v)||v<=0||(kind==='percent'&&v>100)||!Number.isFinite(t)||t<0||!Number.isFinite(stage)||stage<0){alert('请检查优惠名称、金额和门槛');return}db.coupons.push({name,kind,value:kind==='fixed'?cents(v):v,threshold:cents(t),group:$('group').value.trim(),stage,expiry:$('expiry').value,source:$('source').value.trim(),url:safe($('couponUrl').value)});persist();render();$('couponName').value=''};
$('saveProduct').onclick=()=>{let url=extract();if(!url){alert('请提供有效商品链接');return}if(!db.products.some(x=>x.url===url)){db.products.push({url,name:$('name').value.trim(),date:new Date().toLocaleString()});persist();render()}};
function optimize(total,cs){let best={amount:total,used:[]};cs=cs.slice().sort((a,b)=>a.stage-b.stage);function visit(i,amount,used,groups){if(i===cs.length){if(amount<best.amount)best={amount,used:used.slice()};return}let c=cs[i];visit(i+1,amount,used,groups);if(amount<c.threshold||(c.group&&groups.has(c.group)))return;let off=c.kind==='fixed'?c.value:Math.round(amount*c.value/100);let next=new Set(groups);if(c.group)next.add(c.group);visit(i+1,Math.max(0,amount-off),used.concat(c.name),next)}visit(0,total,[],new Set());return best}
$('calculate').onclick=()=>{let p=cents($('price').value),s=cents($('shipping').value),r=cents($('rebate').value),cs=[...$('eligible').querySelectorAll('input:checked')].map(x=>db.coupons[Number(x.value)]).filter(valid);if(!$('price').value||![p,s,r].every(x=>Number.isSafeInteger(x)&&x>=0)||cs.length>18){alert('请检查金额，每次最多选18张券');return}let best=optimize(p,cs),a=$('answer');a.replaceChildren();node('p','预计实付（含运费）',a);node('div',money(best.amount+s),a).className='price';node('p','使用顺序：'+(best.used.join(' → ')||'不使用优惠券'),a);node('p','预计节省 '+money(p-best.amount)+'；返利另计 '+money(r),a);node('small','此为已确认规则下的计算结果，非平台结算价。',a)};
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
